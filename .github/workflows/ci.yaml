name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        # Benchmarks (@Tags(['benchmark'])) are excluded here — each one
        # runs a deliberate ~2s warm-up + exercise window by design (see
        # test/performance/benchmark_test.dart), which is real signal for a
        # benchmark and just latency on every PR. The `benchmark` job below
        # runs them, only on pushes to main.
        run: flutter test --coverage --exclude-tags=benchmark,live_server

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # Don't fail the build over Codecov itself — e.g. before the repo
          # is connected on codecov.io / before CODECOV_TOKEN is set.
          fail_ci_if_error: false

  benchmark:
    # Only on pushes that land on main — a merged PR, i.e. code about to
    # ship — not on every PR push. Benchmarks are a warn-only regression
    # check (see test/performance/benchmark_test.dart), not a merge gate,
    # so there is no value in paying their ~20s on every PR iteration.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Run benchmarks
        run: flutter test --tags=benchmark --reporter expanded

  release-build:
    # Same gating as `benchmark`: a merged PR, not every PR push — a
    # signed release build is the real release artifact, built once per
    # thing that actually ships, not on every iteration of a change still
    # under review.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      # Recreates exactly what a local `android/key.properties` +
      # `upload-keystore.jks` would be — see android/build.gradle.kts,
      # which signs with these if present and falls back to the debug
      # key otherwise (so a fork or a PR from someone without these
      # secrets still builds, just unsigned-for-release).
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      # Proves the APK is actually signed with the real release key, not
      # silently falling back to the debug key because a secret was
      # empty or misnamed — the same discipline this repo applies
      # everywhere else (verify the real artifact, don't trust that the
      # steps ran without erroring).
      - name: Verify release signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk

name: ledger
description: "Offline-first shared household ledger built with event sourcing and CQRS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  meta: ^1.16.0

  # State management (CQRS read side feeds Riverpod streams).
  flutter_riverpod: ^3.4.3

  # Local event store + materialized projections (typed SQL).
  # drift >= 2.32 bundles an up-to-date sqlite3 on every platform, so
  # sqlite3_flutter_libs is no longer needed.
  drift: ^2.35.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Time-ordered, causally-aware event identity.
  uuid: ^4.5.1

  # Connectivity signal to trigger sync.
  connectivity_plus: ^7.3.1

  # Navigation.
  go_router: ^18.0.1

  # Real HTTP transport to ledger-sync-server (the sync server, kept in a
  # separate repository — see docs/adr/0007).
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen for drift.
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

  # Test doubles.
  mocktail: ^1.0.4

  # Formal micro-benchmarks (test/performance/benchmarks/), instead of
  # hand-rolled Stopwatch timing.
  benchmark_harness: ^2.4.0

  # Building a raw pre-migration database file by hand in
  # app_database_migration_test.dart — the same package drift itself uses
  # under the hood, declared directly rather than relied on transitively.
  sqlite3: ^3.5.2

  # Strict lint set.
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

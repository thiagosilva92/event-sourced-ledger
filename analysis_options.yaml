include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Dependencies are grouped by purpose with comments, which is more
    # readable here than a flat alphabetical list.
    sort_pub_dependencies: false
    # Sequential calls to the same object read fine as statements, especially
    # in arrange/act/assert tests; forcing cascades hurts readability here.
    cascade_invocations: false
    # Prefer the explicit `ClassName(...)` constructor form over the Dart 3.13
    # `.new(...)` shorthand — it stays legible to readers not yet fluent in
    # the newest syntax.
    unnecessary_type_name_in_constructor: false
    # Named constructor parameters read better with a plain descriptive name
    # (`localStore:`) than an underscore-prefixed one, but named parameters
    # can't be private in Dart — so a field that should stay private (most
    # of them) can't be assigned via an initializing formal. Applies
    # consistently across this codebase; see e.g. HybridLogicalClock and
    # SyncService.
    prefer_initializing_formals: false
    # No logging framework is wired up yet. `print` in a debug-only screen
    # or a performance test's reported numbers is the right tool until
    # there is one — not worth an `ignore:` at every call site.
    avoid_print: false
